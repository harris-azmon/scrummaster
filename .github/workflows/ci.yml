name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: scrummaster
          mamba-version: "*"
          channels: conda-forge,defaults

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Core Tests
        shell: bash -l {0}
        run: |
          cd scrummaster-core && pytest --cov=scrummaster_core --cov-report=xml --cov-fail-under=100

      - name: Static Analysis
        shell: bash -l {0}
        run: |
          ruff check .
          ruff format --check .
          cd scrummaster-core && mypy --strict src

      - name: Build Core
        shell: bash -l {0}
        run: |
          ./scripts/build_core.sh

      - name: Validate Artifacts
        shell: bash -l {0}
        run: |
          python scripts/scrummaster_dev.py verify
