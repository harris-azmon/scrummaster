[tools]
python = "3.12"
node = "20"
uv = "latest"

[tasks]
# Build tasks
build-all = { depends = ["build-core"], run = "echo 'All builds complete'" }
build-core = { run = "cd scrummaster-core && uv build" }

# Install tasks
install-all = { depends = ["install-core", "install-claude"], run = "echo 'All components installed'" }
install-core = { run = "pip install ./scrummaster-core" }
install-claude = { run = "bash -c 'cp -r .claude ~/.claude 2>/dev/null || echo \"Claude Code not available, skipping\"'" }

# Update tasks
update-all = { run = "python scripts/scrummaster_update.py" }
check-updates = { run = "python scripts/scrummaster_update.py --check-only" }

# Verification
verify = { run = "python scripts/verify_installation.py" }
verify-docs = { run = "python scripts/validate_docs.py" }

# Development
dev-setup = { depends = ["install-dev-deps"], run = "echo 'Development environment ready'" }
install-dev-deps = { run = "pip install -e scrummaster-core" }
test = { run = "pytest" }
lint = { run = "ruff check ." }
format = { run = "ruff format ." }

# Documentation
docs-build = { run = "python scripts/validate_docs.py && echo 'Documentation validation complete'" }
docs-serve = { run = "echo 'Serving documentation...' && python -m http.server 8080" }

[env]
SCRUMMASTER_VERSION = "0.1.0"
SCRUMMASTER_HOME = "{{cwd}}"
PYTHONPATH = "{{cwd}}/scrummaster-core/src"

[settings]
experimental = true
python_compile = true

[plugins]
# Add any custom plugins here if needed
