target-version = "py39"
line-length = 120

[lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle (We have a separate documentation strategy)
    "COM812",  # Missing trailing comma (conflict with formatter)
    "ISC001",  # Single line implicit string concatenation (conflict with formatter)
    "TRY003",  # Avoid specifying long messages outside the exception class
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "FIX002",  # Line contains TODO
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "CPY001",  # Missing copyright notice (no copyright-header convention in this repo)

    # --- Deliberately relaxed rule categories (per-file/real fixes deferred) ---
    "BLE001",  # Blind except (broad error handling is intentional in CLI/orchestration entrypoints)
    "FBT001",  # Boolean positional arg in def (would require API/call-site churn across the codebase)
    "FBT002",  # Boolean default positional arg (same as above)
    "PTH100", "PTH108", "PTH109", "PTH110", "PTH118", "PTH120", "PTH123", "PTH208",
               # os.path/pathlib migration (mechanical but large-surface; tracked as follow-up)
    "PLR2004", # Magic value comparison (mostly small literal thresholds; low bug-finding value here)
    "ANN001", "ANN201", "ANN401",  # Missing/loose type annotations (mypy --strict already covers the source tree)
    "ARG001", "ARG002", "ARG005", # Unused arguments (often required by callback/interface signatures)
    "C901", "PLR0912", "PLR0913", "PLR0915",  # Complexity (real refactors, out of scope for this pass)
    "ERA001",  # Commented-out code (frequent false positives on doc-style comments)
    "TRY002", "TRY300",  # Exception style preferences (not correctness issues)
    "PERF203",  # try/except in loop (micro-optimization, not worth the churn here)
    "S101",    # assert usage outside tests/ (also covered per-file for tests/)
    "S108", "S310", "S602", "S603", "S701",  # Security lints already reviewed as intentional/safe usages
    "PLC0415", # Import outside top level (deliberate lazy imports to avoid circular deps / optional deps)
]

[lint.per-file-ignores]
"**/tests/*" = ["S101", "ANN", "PLR2004", "INP001"] # Assertions, types, magic numbers in tests
"scripts/*" = ["INP001", "T201"] # Implicit namespace packages; these are CLI tools whose job is to print to stdout
"**/scripts/*" = ["T201", "INP001"] # Nested CLI helper scripts (e.g. skills/*/scripts/) also print to stdout and aren't packages
